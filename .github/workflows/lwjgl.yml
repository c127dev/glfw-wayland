name: Build libglfw.so (Wayland preferred + X11)

on:
  workflow_dispatch:
  push:
    branches:
      - wayland-preferred

permissions:
  contents: write

env:
  GLFW_PARAMS: -DGLFW_LIBRARY_TYPE=SHARED -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=Release

jobs:
  linux:
    name: Linux x64 (Wayland + X11)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version
        id: version
        run: |
          glfw_version=$(sed -n 's/^project(GLFW VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=${glfw_version}-v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install cmake ninja-build \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DGLFW_BUILD_WAYLAND=ON \
            -DGLFW_BUILD_X11=ON \
            -DCMAKE_C_FLAGS:STRING="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $GLFW_PARAMS

      - name: Build
        run: |
          cmake --build build --parallel
          strip build/src/libglfw.so
          cp build/src/libglfw.so libglfw-x64.so

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libglfw.so-linux-x64
          path: |
            libglfw-x64.so

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: libglfw.so ${{ steps.version.outputs.version }} (Wayland preferred + X11)
          prerelease: false
          make_latest: true
          files: |
            libglfw-x64.so

  linux-cross:
    name: Linux ${{ matrix.ARCH }} (Wayland + X11)
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ARCH: arm64
            RUNNER: ubuntu-22.04
            CROSS_ARCH: arm64
            TRIPLET: aarch64-linux-gnu
            GCC: 12
          - ARCH: riscv64
            RUNNER: ubuntu-24.04
            CROSS_ARCH: riscv64
            TRIPLET: riscv64-linux-gnu
            GCC: 14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compute release version
        id: version
        run: |
          glfw_version=$(sed -n 's/^project(GLFW VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=${glfw_version}-v$(date -u +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Install host build tools
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install cmake ninja-build pkg-config \
            gcc-${{ matrix.GCC }}-${{ matrix.TRIPLET }} \
            libc6-dev-${{ matrix.CROSS_ARCH }}-cross \
            libwayland-bin wayland-protocols

      - name: Enable ${{ matrix.CROSS_ARCH }} packages
        if: matrix.RUNNER == 'ubuntu-22.04'
        run: |
          sudo grep '^deb ' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/ports.list
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo sed -i 's#^deb [^ ]\+#deb [arch=${{ matrix.CROSS_ARCH }}] https://ports.ubuntu.com/ubuntu-ports/#' /etc/apt/sources.list.d/ports.list
          sudo dpkg --add-architecture ${{ matrix.CROSS_ARCH }}
          sudo apt-get update || true

      - name: Enable ${{ matrix.CROSS_ARCH }} packages
        if: matrix.RUNNER == 'ubuntu-24.04'
        run: |
          native="$(dpkg --print-architecture)"
          . /etc/os-release
          suite="${VERSION_CODENAME}"
          keyring="/usr/share/keyrings/ubuntu-archive-keyring.gpg"
          components="main restricted universe multiverse"

          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: ${suite} ${suite}-updates ${suite}-backports
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: ${suite}-security
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}
          EOF

          sudo tee /etc/apt/sources.list.d/ci-ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: https://ports.ubuntu.com/ubuntu-ports/
          Suites: ${suite} ${suite}-updates ${suite}-backports ${suite}-security
          Components: ${components}
          Architectures: ${{ matrix.CROSS_ARCH }}
          Signed-By: ${keyring}
          EOF

          sudo dpkg --add-architecture ${{ matrix.CROSS_ARCH }}
          sudo apt-get update

      - name: Install ${{ matrix.CROSS_ARCH }} dependencies
        run: |
          sudo apt-get -yq install \
            libxkbcommon-dev:${{ matrix.CROSS_ARCH }} \
            libwayland-dev:${{ matrix.CROSS_ARCH }} \
            libegl1-mesa-dev:${{ matrix.CROSS_ARCH }} \
            libxrandr-dev:${{ matrix.CROSS_ARCH }} \
            libxinerama-dev:${{ matrix.CROSS_ARCH }} \
            libxcursor-dev:${{ matrix.CROSS_ARCH }} \
            libxi-dev:${{ matrix.CROSS_ARCH }} \
            libxext-dev:${{ matrix.CROSS_ARCH }}

      - name: Configure
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{ matrix.TRIPLET }}/pkgconfig:/usr/share/pkgconfig"
          CC=${{ matrix.TRIPLET }}-gcc-${{ matrix.GCC }} cmake -B build -G Ninja \
            -DGLFW_BUILD_WAYLAND=ON \
            -DGLFW_BUILD_X11=ON \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_FLAGS:STRING="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $GLFW_PARAMS

      - name: Build
        run: |
          cmake --build build --parallel
          ${{ matrix.TRIPLET }}-strip build/src/libglfw.so
          cp build/src/libglfw.so libglfw-${{ matrix.ARCH }}.so

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libglfw.so-linux-${{ matrix.ARCH }}
          path: |
            libglfw-${{ matrix.ARCH }}.so

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: libglfw.so ${{ steps.version.outputs.version }} (Wayland preferred + X11)
          prerelease: false
          make_latest: true
          files: |
            libglfw-${{ matrix.ARCH }}.so
