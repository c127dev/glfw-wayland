name: LWJGL Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_PARAMS: --cache-control "public,must-revalidate,proxy-revalidate,max-age=0"
  GLFW_PARAMS: -DGLFW_LIBRARY_TYPE=SHARED -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=Release

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        ARCH: [ x64 ]
        include:
          - ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: dnf -y install git
      - name: Clone repository
        run: git clone --depth 5 https://github.com/${{ github.repository }}.git .
      - name: Install build dependencies
        run: |
          dnf -y install epel-release wget
          dnf config-manager --set-enabled powertools
          dnf -y update
          dnf -y install gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ cmake awscli
      - name: Install GLFW dependencies
        run: |
          dnf -y install \
            libXrandr-devel \
            libXinerama-devel \
            libXcursor-devel \
            libXi-devel \
            libXext-devel \
            libxkbcommon-devel \
            wayland-devel \
            wayland-protocols-devel
      - name: Configure build
        run: |
          source /opt/rh/gcc-toolset-15/enable || true
          cmake -B build \
            -DGLFW_BUILD_WAYLAND=ON \
            -DCMAKE_C_FLAGS:STRING="${CMAKE_C_FLAGS} -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $GLFW_PARAMS
      - name: Build
        run: |
          source /opt/rh/gcc-toolset-15/enable || true
          cmake --build build --parallel
          strip build/src/libglfw.so
      - name: Upload artifact
        run: aws s3 cp build/src/libglfw.so s3://lwjgl-build/nightly/linux/${{matrix.ARCH}}/ ${{env.S3_PARAMS}}
      - name: Upload git revision
        run: |
          git config --global --add safe.directory $PWD
          git log --first-parent --pretty=format:%H --skip 4 -n 1 > revision.git
          cat revision.git
          echo
          aws s3 cp revision.git s3://lwjgl-build/nightly/linux/${{matrix.ARCH}}/libglfw.so.git ${{env.S3_PARAMS}}

  linux-cross:
    name: Linux Cross
    runs-on: ${{matrix.RUNNER}}
    strategy:
      fail-fast: false
      matrix:
        ARCH: [arm32, arm64, ppc64le, riscv64]
        include:
          - ARCH: arm32
            RUNNER: ubuntu-22.04
            CROSS_ARCH: armhf
            TRIPLET: arm-linux-gnueabihf
            GCC: 12
          - ARCH: arm64
            RUNNER: ubuntu-22.04
            CROSS_ARCH: arm64
            TRIPLET: aarch64-linux-gnu
            GCC: 12
          - ARCH: ppc64le
            RUNNER: ubuntu-22.04
            CROSS_ARCH: ppc64el
            TRIPLET: powerpc64le-linux-gnu
            GCC: 12
          - ARCH: riscv64
            RUNNER: ubuntu-24.04
            CROSS_ARCH: riscv64
            TRIPLET: riscv64-linux-gnu
            GCC: 14
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install cmake \
            gcc-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            libc6-dev-${{matrix.CROSS_ARCH}}-cross
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Prepare cross-compilation for ${{matrix.CROSS_ARCH}}
        if: matrix.RUNNER == 'ubuntu-22.04'
        run: |
          sudo grep 'deb ' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/ports.list
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo sed -i 's#^deb [^ ]\+#deb [arch=${{matrix.CROSS_ARCH}}] https://ports.ubuntu.com/ubuntu-ports/#' /etc/apt/sources.list.d/ports.list
          sudo dpkg --add-architecture ${{matrix.CROSS_ARCH}}
          sudo apt-get update
      - name: Prepare cross-compilation for ${{matrix.CROSS_ARCH}}
        if: matrix.RUNNER == 'ubuntu-24.04'
        run: |
          native="$(dpkg --print-architecture)"
          . /etc/os-release
          suite="${VERSION_CODENAME}"
          keyring="/usr/share/keyrings/ubuntu-archive-keyring.gpg"
          components="main restricted universe multiverse"

          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: ${suite} ${suite}-updates ${suite}-backports
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: ${suite}-security
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}
          EOF

          sudo tee /etc/apt/sources.list.d/ci-ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: https://ports.ubuntu.com/ubuntu-ports/
          Suites: ${suite} ${suite}-updates ${suite}-backports ${suite}-security
          Components: ${components}
          Architectures: ${{matrix.CROSS_ARCH}}
          Signed-By: ${keyring}
          EOF

          sudo dpkg --add-architecture ${{matrix.CROSS_ARCH}}
          sudo apt-get update
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install \
            libxrandr-dev:${{matrix.CROSS_ARCH}} \
            libxinerama-dev:${{matrix.CROSS_ARCH}} \
            libxcursor-dev:${{matrix.CROSS_ARCH}} \
            libxi-dev:${{matrix.CROSS_ARCH}} \
            libxext-dev:${{matrix.CROSS_ARCH}} \
            libxkbcommon-dev:${{matrix.CROSS_ARCH}} \
            libwayland-dev:${{matrix.CROSS_ARCH}}
      - name: Configure build
        run: |
          export PKG_CONFIG_LIBDIR="/usr/lib/${{matrix.TRIPLET}}/pkgconfig:/usr/share/pkgconfig"
          CC=${{matrix.TRIPLET}}-gcc-${{matrix.GCC}} cmake -B build \
            -DGLFW_BUILD_WAYLAND=ON \
            -DCMAKE_C_FLAGS:STRING="${CMAKE_C_FLAGS} -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0" \
            $GLFW_PARAMS
      - name: Build
        run: |
          cmake --build build --parallel
          ${{matrix.TRIPLET}}-strip build/src/libglfw.so
      - name: Upload artifact
        run: aws s3 cp build/src/libglfw.so s3://lwjgl-build/nightly/linux/${{matrix.ARCH}}/ ${{env.S3_PARAMS}}
      - name: Upload git revision
        run: |
          git config --global --add safe.directory $(pwd)
          git log --first-parent --pretty=format:%H --skip 4 -n 1 > revision.git
          cat revision.git
          echo
          aws s3 cp revision.git s3://lwjgl-build/nightly/linux/${{matrix.ARCH}}/libglfw.so.git ${{env.S3_PARAMS}}

  freebsd-cross:
    name: FreeBSD Cross
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Start VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.4'
          memory: 4G
          environment_variables: GLFW_PARAMS
      - name: Install build dependencies
        shell: cpa.sh {0}
        run: sudo pkg install -y cmake gmake pkgconf
      - name: Install dependencies
        shell: cpa.sh {0}
        run: |
          sudo pkg install -y \
            libXrandr \
            libXinerama \
            libXcursor \
            libXi \
            libXext \
            libxkbcommon \
            wayland \
            wayland-protocols \
            libevdev \
            evdev-proto
      - name: Configure build
        shell: cpa.sh {0}
        run: cmake -B build $GLFW_PARAMS -DGLFW_BUILD_WAYLAND=ON -DCMAKE_C_FLAGS="-std=c99 -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
      - name: Build
        shell: cpa.sh {0}
        run: |
          cmake --build build --parallel
          strip build/src/libglfw.so
      - name: Upload artifact
        run: aws s3 cp build/src/libglfw.so s3://lwjgl-build/nightly/freebsd/x64/ ${{env.S3_PARAMS}}
      - name: Upload git revision
        run: |
          git config --global --add safe.directory $PWD
          git log --first-parent --pretty=format:%H --skip 4 -n 1 > revision.git
          cat revision.git
          echo
          aws s3 cp revision.git s3://lwjgl-build/nightly/freebsd/x64/libglfw.so.git ${{env.S3_PARAMS}}

  macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      matrix:
        ARCH: [x64, arm64]
        include:
          - ARCH: x64
            CMAKE_PARAMS: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.11 -DCMAKE_OSX_ARCHITECTURES=x86_64
          - ARCH: arm64
            CMAKE_PARAMS: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
      - name: Configure build
        run: cmake -B build $GLFW_PARAMS ${{matrix.CMAKE_PARAMS}}
      - name: Build
        run: |
          cmake --build build --parallel
          strip -u -r build/src/libglfw.dylib
      - name: Upload artifact
        run: aws s3 cp build/src/libglfw.dylib s3://lwjgl-build/nightly/macosx/${{matrix.ARCH}}/ ${{env.S3_PARAMS}}
      - name: Upload git revision
        run: |
          git log --first-parent --pretty=format:%H --skip 4 -n 1 > revision.git
          cat revision.git
          echo
          aws s3 cp revision.git s3://lwjgl-build/nightly/macosx/${{matrix.ARCH}}/libglfw.dylib.git ${{env.S3_PARAMS}}

  windows:
    name: Windows
    runs-on: windows-2022
    strategy:
      matrix:
        ARCH: [x86, x64, arm64]
        include:
          - ARCH: x86
            PLATFORM: Win32
            VCTOOLS: x86.x64
          - ARCH: x64
            PLATFORM: x64
            VCTOOLS: x86.x64
          - ARCH: arm64
            PLATFORM: ARM64
            VCTOOLS: ARM64
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
#      - name: Install Visual Studio 2026 Build Tools
#        shell: pwsh
#        run: |
#          choco install cmake
#          choco install visualstudio2026buildtools --package-parameters "`
#            --add Microsoft.VisualStudio.Workload.VCTools `
#            --add Microsoft.VisualStudio.Component.VC.Tools.${{matrix.VCTOOLS}} `
#            --includeRecommended `
#            --quiet" `
#            -y `
#            --ignore-package-exit-codes=3010
      - name: Configure build
        #-T ClangCL
        run: cmake -B build -G "Visual Studio 17 2022" -A ${{matrix.PLATFORM}} %GLFW_PARAMS% -DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF
      - name: Build
        run: cmake --build build --parallel --config Release
      - name: Upload artifact
        run: aws s3 cp build\src\Release\glfw3.dll s3://lwjgl-build/nightly/windows/${{matrix.ARCH}}/glfw.dll ${{env.S3_PARAMS}}
      - name: Upload git revision
        run: |
          git log --first-parent --pretty=format:%%H --skip 4 -n 1 > revision.git
          type revision.git
          echo(
          aws s3 cp revision.git s3://lwjgl-build/nightly/windows/${{matrix.ARCH}}/glfw.dll.git ${{env.S3_PARAMS}}
